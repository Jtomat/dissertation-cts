<div class="brand">My IDE</div>
<div class="tools">
<app-title-bar-menu [dataItem]="navBarItems" />
</div>
<div class="draggable">

</div>
<div class="controls">
    <button matIconButton class="btn" (click)="minimize()">
        <mat-icon>remove</mat-icon>
    </button>
    <button matIconButton class="btn" (click)="maximize()">
        <mat-icon>crop_square</mat-icon>
    </button>
    <button matIconButton class="close-btn btn" (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</div>
